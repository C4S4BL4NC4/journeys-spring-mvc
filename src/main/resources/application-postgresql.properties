# PostgreSQL instead of the in-memory H2 database: run with --spring.profiles.active=postgresql.
# Everything else comes from application.properties; Boot detects the driver and dialect from the URL.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/journeys}
spring.datasource.username=${DB_USERNAME:itinera}
spring.datasource.password=${DB_PASSWORD:itinera}
