spring.application.name=journeys-spring-mvc
server.port=8080
spring.datasource.url=jdbc:h2:mem:journeys;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
#todo - ADMIN CREDENTIALS REMOVE LATER AND IMPLEMENT SECURITY
spring.security.user.name=admin
spring.security.user.password=admin
