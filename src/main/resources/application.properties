spring.application.name=journeys-spring-mvc
spring.datasource.url=jdbc:h2:mem:journeys;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
# Flyway owns the schema; Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate
# Services do all database work inside transactions, so don't hold a connection for the whole request
spring.jpa.open-in-view=false
# Load lazy collections (images, stops, guides...) for many tours at once instead of one query per tour
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Paging: ?page=0&size=25&sort=field,desc; pages serialize as {"content": [...], "page": {...}}
spring.data.web.pageable.default-page-size=25
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto
# swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
# Keycloak issues the access tokens this API accepts (start it with: docker compose up -d).
# Signing keys are fetched from the issuer on first use, so the app starts even if Keycloak is down.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/journeys}
# Only accept tokens minted for this API; the realm's audience mapper adds "journeys-api"
spring.security.oauth2.resourceserver.jwt.audiences=journeys-api
# Swagger UI logs in through Keycloak's public browser client
springdoc.swagger-ui.oauth.client-id=journeys-web
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
# Calling Keycloak's admin API (KeycloakAdminClient) as the confidential "journeys-backend"
# client with the client-credentials grant. The secret below is the realm file's dev value;
# set KEYCLOAK_BACKEND_CLIENT_SECRET anywhere real.
spring.security.oauth2.client.registration.keycloak-admin.provider=keycloak
spring.security.oauth2.client.registration.keycloak-admin.client-id=journeys-backend
spring.security.oauth2.client.registration.keycloak-admin.client-secret=${KEYCLOAK_BACKEND_CLIENT_SECRET:journeys-backend-dev-secret}
spring.security.oauth2.client.registration.keycloak-admin.authorization-grant-type=client_credentials
# Token endpoint given explicitly so startup doesn't need Keycloak to be reachable
spring.security.oauth2.client.provider.keycloak.token-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token
# Uploaded images (user photos, tour images); served at /img/**
journeys.storage.image-dir=${JOURNEYS_IMAGE_DIR:uploads/img}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB
