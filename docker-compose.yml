# Local development services. Start with: docker compose up -d
#
# postgres  PostgreSQL 17 on localhost:5432, data kept in the "postgres-data" volume
#           - database "journeys" (user itinera / itinera) for the API: run the app with
#             --spring.profiles.active=postgresql; Flyway creates the schema on first start
#           - database "keycloak" (user keycloak / keycloak) for Keycloak, created by
#             docker/postgres/init on first start
#
# keycloak  identity provider for the Journeys API (http://localhost:9090), storing its data
#           in the postgres service so users, roles and sessions survive restarts
#           - admin console: http://localhost:9090/admin  (admin / admin)
#           - imports ./keycloak/journeys-realm.json when the realm doesn't exist yet: roles,
#             clients (incl. the API's journeys-backend service account) and the seed users
#             (password "password123"), whose ids match BootstrapData's users
#           - after editing the realm file, re-import it with a clean slate:
#             docker compose down -v && docker compose up -d   (-v also wipes the API's data)
#
# All credentials here are for local development only.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: journeys
      POSTGRES_USER: itinera
      POSTGRES_PASSWORD: itinera
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itinera -d journeys"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    ports:
      - "9090:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
